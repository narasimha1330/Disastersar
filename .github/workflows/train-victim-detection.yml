name: Train victim detection model

on:
  workflow_dispatch:
  push:
    paths:
      - "victim_detection/**"
      - ".github/workflows/train-victim-detection.yml"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: victim_detection/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r victim_detection/requirements.txt
      - name: Download and validate dataset
        run: python victim_detection/prepare_dataset.py
      - name: Train and evaluate on held-out test split
        run: python victim_detection/train.py --epochs 20 --imgsz 512 --batch 8
      - name: Upload model weights, metrics, and training plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victim-detection-training-results
          path: |
            victim_detection/runs/
            yolov8n.pt
          if-no-files-found: warn
          retention-days: 30
